# Configuration documentation:
# https://github.com/selectdb/cappy/blob/main/llms-wiki/05-context.md

databases:
- type: duckdb
  name: olist
  include:
  - main.fct_*
  - main.dim_*
  exclude: []
  allow_listed_only: false
  templates:
  - columns
  - preview
  - profiling
  # - query_history  -- Pulls most frequent queries / joins on each table
  query_history_exclude_patterns: []
  profiling:
    refresh_policy: always
    interval_days: 7
  ai_summary:
    refresh_policy: always
    interval_days: 7
  path: /Users/mry/Downloads/cappy-agent/olist-data/olist.duckdb
semantic_layer:
  type: metricflow
  manifest_path: ./semantics/semantic_manifest.json
  database: olist
