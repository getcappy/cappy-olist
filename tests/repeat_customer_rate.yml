name: repeat_customer_rate
prompt: 复购客户占比是多少？复购客户有多少人？
sql: |
  SELECT
    round(100.0 * SUM(CASE WHEN is_repeat_customer THEN 1 ELSE 0 END) / COUNT(*), 2) AS repeat_customer_rate_pct,
    SUM(CASE WHEN is_repeat_customer THEN 1 ELSE 0 END) AS repeat_customers,
    COUNT(*) AS customers
  FROM dim_customers
assertions:
  - type: tool_call
    tool: execute_sql
