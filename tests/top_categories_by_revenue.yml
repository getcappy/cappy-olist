name: top_categories_by_revenue
prompt: 商品收入最高的 5 个类目是哪些？
sql: |
  SELECT
    COALESCE(t.product_category_name_english, p.product_category_name, 'unknown') AS category_en,
    round(SUM(i.price), 2) AS item_revenue,
    COUNT(*) AS items_sold
  FROM olist_order_items_dataset i
  LEFT JOIN olist_products_dataset p ON i.product_id = p.product_id
  LEFT JOIN product_category_name_translation t ON p.product_category_name = t.product_category_name
  GROUP BY 1
  ORDER BY item_revenue DESC
  LIMIT 5
assertions:
  - type: tool_call
    tool: execute_sql
