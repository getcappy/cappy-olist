name: late_delivery_rate
prompt: 已送达订单的延迟交付率是多少？
sql: |
  SELECT round(
    100.0 * SUM(CASE WHEN order_status = 'delivered'
                      AND order_delivered_customer_date > order_estimated_delivery_date
                     THEN 1 ELSE 0 END)
    / SUM(CASE WHEN order_status = 'delivered' THEN 1 ELSE 0 END), 2
  ) AS late_delivery_rate_pct
  FROM olist_orders_dataset
assertions:
  - type: tool_call
    tool: execute_sql
