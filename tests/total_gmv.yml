name: total_gmv
prompt: 这个平台的总 GMV 是多少？包含运费。
sql: |
  WITH order_gmv AS (
    SELECT o.order_id, COALESCE(SUM(i.price + i.freight_value), 0) AS gmv
    FROM olist_orders_dataset o
    LEFT JOIN olist_order_items_dataset i ON o.order_id = i.order_id
    GROUP BY o.order_id
  )
  SELECT round(SUM(gmv), 2) AS gmv FROM order_gmv
assertions:
  - type: tool_call
    tool: execute_sql
